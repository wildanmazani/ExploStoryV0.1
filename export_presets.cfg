html/head_include="<meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-fullscreen\"><script>(function(){var d=document,e=d.documentElement,b;if(!(matchMedia('(pointer: coarse)').matches||'ontouchstart' in window))return;if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;function on(){return d.fullscreenElement||d.webkitFullscreenElement}function show(){if(b)b.style.display=on()?'none':'block'}function lock(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){})}function tap(ev){ev.preventDefault();ev.stopPropagation();var r=e.requestFullscreen||e.webkitRequestFullscreen;if(r&&(d.fullscreenEnabled||d.webkitFullscreenEnabled)){var p=r.call(e,{navigationUI:'hide'});if(p&&p.then)p.then(lock,function(){});else lock()}else{alert('iPhone tidak benarkan skrin penuh dalam pelayar. Tekan butang Kongsi, pilih Tambah ke Skrin Utama, kemudian buka game dari ikon itu.')}}d.addEventListener('fullscreenchange',show);d.addEventListener('webkitfullscreenchange',show);d.addEventListener('DOMContentLoaded',function(){b=d.createElement('button');b.id='skrin-penuh';b.textContent='\\u26F6 Skrin Penuh';b.style.cssText='position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2147483647;padding:10px 18px;font:bold 16px sans-serif;color:#fff;background:#8a5a2e;border:2px solid #f3c64b;border-radius:10px;touch-action:manipulation';b.addEventListener('click',tap);d.body.appendChild(b);show()})})();</script><!--muat--><style>#status{background:transparent!important;z-index:2!important} #status-progress,#status-splash{display:none!important} #muat{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 40%,#2c3550 0%,#1b2030 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Trebuchet MS',Verdana,sans-serif;color:#f5e6c8;transition:opacity .7s ease;pointer-events:none} #muat.habis{opacity:0} #muat .logo{font:900 clamp(34px,7vw,72px)/1 'Trebuchet MS',Verdana,sans-serif;letter-spacing:4px;color:#f3c64b;text-shadow:0 4px 0 #8a5a2e,0 8px 18px rgba(0,0,0,.5);margin-bottom:clamp(40px,9vh,90px)} #muat .jalan{position:relative;width:min(640px,80vw);height:138px} #muat .rel{position:absolute;left:0;right:0;bottom:0;height:18px;border-radius:10px;background:#3a2a1c;border:3px solid #c99a4a;box-shadow:inset 0 3px 0 rgba(0,0,0,.35);overflow:hidden} #muat .isi{height:100%;width:0;background:repeating-linear-gradient(-45deg,#f3c64b 0 14px,#e8a93a 14px 28px);background-size:40px 100%;animation:jalur .8s linear infinite} @keyframes jalur{to{background-position:40px 0}} #muat .alif{position:absolute;left:0;bottom:14px;width:108px;height:108px;margin-left:-54px;background:url(data:image/png;base64,) 0 0/648px 108px;image-rendering:pixelated;animation:lari .6s steps(6) infinite} @keyframes lari{to{background-position:-648px 0}} #muat .pau{position:absolute;left:0;bottom:22px;width:48px;height:48px;margin-left:54px;background:url(data:image/png;base64,) 0 0/48px 48px;image-rendering:pixelated;animation:lompat .45s ease-in-out infinite alternate} @keyframes lompat{from{transform:translateY(0) scale(1.08,.92)}to{transform:translateY(-34px) scale(.95,1.05)}} #muat .peratus{margin-top:14px;font-weight:700;font-size:18px;color:#f3c64b} #muat .tip{margin-top:10px;font-size:clamp(14px,2.2vw,18px);opacity:.85;min-height:1.4em;transition:opacity .4s;text-align:center;padding:0 16px}</style><script>(function(){var TIPS=['Alif tengah kejar Pau...','Tip: Klik Pau bila buntu, dia bagi petunjuk.','Tip: Jawab betul cubaan pertama, dapat lebih EXP.','Tip: Buka Beg Alif untuk Jalan Pintas.','Tip: Gelanggang: jawab cepat, serang kuat!'];function go(){var d=document,m=d.createElement('div');m.id='muat';m.innerHTML='<div class=\"logo\">EXPLO-STORY</div><div class=\"jalan\"><div class=\"rel\"><div class=\"isi\"></div></div><div class=\"alif\"></div><div class=\"pau\"></div></div><div class=\"peratus\">0%</div><div class=\"tip\"></div>';d.body.appendChild(m);var isi=m.querySelector('.isi'),alif=m.querySelector('.alif'),pau=m.querySelector('.pau'),per=m.querySelector('.peratus'),tip=m.querySelector('.tip'),t=0,shown=0,cur=0,fake=0,done=0;tip.textContent=TIPS[0];setInterval(function(){tip.style.opacity=0;setTimeout(function(){t=(t+1)%TIPS.length;tip.textContent=TIPS[t];tip.style.opacity=.85},400)},2800);var timer=setInterval(function(){var s=d.getElementById('status'),p=d.getElementById('status-progress');if(!s||!s.isConnected){if(!done){done=1;shown=100;setTimeout(function(){m.className='habis';setTimeout(function(){clearInterval(timer);m.remove()},800)},600)}draw();return}var v=0;if(p&&p.max>0&&p.value>0){v=Math.min(100,p.value/p.max*100)}else{fake=Math.min(95,fake+(95-fake)*0.02);v=fake}var n=d.getElementById('status-notice');if(n&&n.style.display!=='none'&&n.textContent){m.style.opacity=.25}shown=Math.max(shown,v);draw()},50);function draw(){cur+=(shown-cur)*0.12;if(shown-cur<0.2)cur=shown;var w=cur.toFixed(1)+'%';isi.style.width=w;alif.style.left=w;pau.style.left=w;per.textContent=Math.round(shown)+'%'}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()})();</script><!--/muat-->"
