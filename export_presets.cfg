ang .ikon svg{width:28px;height:28px} #pasang .ikon.app{background:#8a5a2e;color:#f3c64b;font-weight:700;font-size:20px;border:2px solid #f3c64b;box-sizing:border-box} #pasang b{color:#fff} #pasang small{display:block;font-size:13px;opacity:.8;margin-top:2px} #pasang .nota{margin:10px 0 0;font-size:14px;text-align:center;opacity:.85} #pasang button{font:bold 16px sans-serif;color:#fff;background:#8a5a2e;border:2px solid #f3c64b;border-radius:10px;padding:10px 22px;touch-action:manipulation} #pasang #pasang-tutup{position:fixed;top:8px;right:8px;padding:8px 16px;z-index:1} @media (orientation:landscape) and (max-height:520px){#pasang ol{grid-template-columns:1fr 1fr}#pasang li{font-size:14px;padding:8px 10px;gap:9px}#pasang h2{font-size:19px}#pasang .sub{margin-bottom:8px;font-size:14px}}</style><script>(function(){var d=document,e=d.documentElement,b,g,ua=navigator.userAgent;if(!(matchMedia('(pointer: coarse)').matches||'ontouchstart' in window))return;if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;var r=e.requestFullscreen||e.webkitRequestFullscreen,can=!!(r&&(d.fullscreenEnabled||d.webkitFullscreenEnabled));var pad=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),alat=pad?'iPad':'iPhone';var chrome=/CriOS/.test(ua),safari=!chrome&&/Safari\\//.test(ua)&&/Version\\//.test(ua)&&!/FxiOS|EdgiOS|OPiOS|OPT\\/|DuckDuckGo|GSA\\//.test(ua);function on(){return d.fullscreenElement||d.webkitFullscreenElement}function show(){if(b)b.style.display=on()||g?'none':'block'}function lock(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){})}function tutup(){if(g){g.remove();g=null;show()}}function salin(ev){var t=ev.currentTarget;function ok(){t.textContent='Pautan disalin \\u2713'}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(location.href).then(ok,function(){prompt('Salin pautan ini:',location.href)});else prompt('Salin pautan ini:',location.href)}function panduan(){if(g)return;var mana=chrome?'Ada di hujung kanan bar alamat Chrome.':(pad?'Ada di bahagian atas Safari.':'Ada di bar Safari. Tak nampak? Tekan \\u2022\\u2022\\u2022 dulu.');var h='<div class=\"kad\"><h2>Cara main di '+alat+'</h2><p class=\"sub\">Letak game di Skrin Utama dulu. Buat sekali saja.</p>';if(!chrome&&!safari)h+='<div class=\"amaran\">Pelayar ini tak boleh pasang game.<br>Salin pautan, buka <b>Safari</b>, tampal di situ, kemudian ikut langkah di bawah.<br><button id=\"pasang-salin\">Salin pautan</button></div>';h+='<ol><li><span class=\"no\">1</span><span class=\"ikon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V3\"/><path d=\"M8 7l4-4 4 4\"/><path d=\"M7 11H5v10h14V11h-2\"/></svg></span><span>Tekan butang <b>Kongsi</b> (Share).<small>'+mana+'</small></span></li>'+'<li><span class=\"no\">2</span><span class=\"ikon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"/><path d=\"M12 8v8M8 12h8\"/></svg></span><span>Scroll ke bawah, tekan <b>Add to Home Screen</b>.<small>Dalam BM: Tambah ke Skrin Utama.</small></span></li>'+'<li><span class=\"no\">3</span><span class=\"ikon\" style=\"font:bold 15px sans-serif\">Add</span><span>Tekan <b>Add</b> (Tambah) di penjuru atas kanan.</span></li>'+'<li><span class=\"no\">4</span><span class=\"ikon app\">E</span><span>Tutup pelayar. Tekan ikon <b>Explo-Story</b> di Skrin Utama.<small>Game terus buka skrin penuh.</small></span></li></ol>'+'<p class=\"nota\">Dah ada akaun? Log masuk semula, kemajuan kekal.</p></div><button id=\"pasang-tutup\">\\u2715 Tutup</button>';g=d.createElement('div');g.id='pasang';g.innerHTML=h;d.body.appendChild(g);g.querySelector('#pasang-tutup').addEventListener('click',tutup);var s=g.querySelector('#pasang-salin');if(s)s.addEventListener('click',salin);show()}function tap(ev){ev.preventDefault();ev.stopPropagation();if(can){var p=r.call(e,{navigationUI:'hide'});if(p&&p.then)p.then(lock,function(){});else lock()}else panduan()}d.addEventListener('fullscreenchange',show);d.addEventListener('webkitfullscreenchange',show);function go(){b=d.createElement('button');b.id='skrin-penuh';b.textContent=can?'\\u26F6 Skrin Penuh':'\\u2B07 Cara main di '+alat;b.addEventListener('click',tap);d.body.appendChild(b);show()}if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',go);else go()})();</script><!--/skrin--><!--muat--><style>#status{background:transparent!important;z-index:2!important} #status-progress,#status-splash{display:none!important} #muat{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 40%,#2c3550 0%,#1b2030 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Trebuchet MS',Verdana,sans-serif;color:#f5e6c8;transition:opacity .7s ease;pointer-events:none} #muat.habis{opacity:0} #muat .logo{width:min(620px,86vw);aspect-ratio:720/224;background:url(data:image/webp;base64,) center/contain no-repeat;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));margin-bottom:clamp(30px,7vh,70px);animation:timbul 2.4s ease-in-out infinite alternate} @keyframes timbul{from{transform:translateY(0)}to{transform:translateY(-8px)}} #muat .jalan{position:relative;width:min(560px,66vw);height:138px} #muat .rel{position:absolute;left:0;right:0;bottom:0;height:18px;border-radius:10px;background:#3a2a1c;border:3px solid #c99a4a;box-shadow:inset 0 3px 0 rgba(0,0,0,.35);overflow:hidden} #muat .isi{height:100%;width:0;background:repeating-linear-gradient(-45deg,#f3c64b 0 14px,#e8a93a 14px 28px);background-size:40px 100%;animation:jalur .8s linear infinite} @keyframes jalur{to{background-position:40px 0}} #muat .alif{position:absolute;left:0;bottom:14px;width:108px;height:108px;margin-left:-54px;background:url(data:image/png;base64,) 0 0/648px 108px;image-rendering:pixelated;animation:lari .6s steps(6) infinite} @keyframes lari{to{background-position:-648px 0}} #muat .pau{position:absolute;left:0;bottom:16px;width:48px;height:48px;margin-left:-108px;background:url(data:image/png;base64,) 0 0/48px 48px;image-rendering:pixelated;transform-origin:50% 100%;animation:lompat .3s ease-in-out infinite alternate} @keyframes lompat{from{transform:translateY(0) scale(1.12,.88)}to{transform:translateY(-16px) scale(.94,1.06)}} #muat .peratus{margin-top:14px;font-weight:700;font-size:18px;color:#f3c64b} #muat .rakan{position:absolute;bottom:clamp(12px,3vh,28px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(14px,3vw,34px);background:#fff;border-radius:14px;padding:8px clamp(12px,2.5vw,26px);box-shadow:0 6px 18px rgba(0,0,0,.35)} #muat .rakan img{height:clamp(34px,7vh,56px);width:auto;display:block} #muat .tip{margin-top:10px;font-size:clamp(14px,2.2vw,18px);opacity:.85;min-height:1.4em;transition:opacity .4s;text-align:center;padding:0 16px}</style><script>(function(){var RAKAN='<img src=\"data:image/webp;base64,\" alt=\"\"><img src=\"data:image/webp;base64,\" alt=\"\"><img src=\"data:image/webp;base64,\" alt=\"\">';var TIPS=['Pau tengah kejar Alif...','Tip: Klik Pau bila buntu, dia bagi petunjuk.','Tip: Jawab betul cubaan pertama, dapat lebih EXP.','Tip: Buka Beg Alif untuk Jalan Pintas.','Tip: Gelanggang: jawab cepat, serang kuat!'];function go(){var d=document,m=d.createElement('div');m.id='muat';m.innerHTML='<div class=\"logo\" role=\"img\" aria-label=\"EXPLO-STORY\"></div><div class=\"jalan\"><div class=\"rel\"><div class=\"isi\"></div></div><div class=\"alif\"></div><div class=\"pau\"></div></div><div class=\"peratus\">0%</div><div class=\"tip\"></div><div class=\"rakan\">' + RAKAN + '</div>';d.body.appendChild(m);var isi=m.querySelector('.isi'),alif=m.querySelector('.alif'),pau=m.querySelector('.pau'),per=m.querySelector('.peratus'),tip=m.querySelector('.tip'),t=0,shown=0,cur=0,fake=0,done=0;tip.textContent=TIPS[0];setInterval(function(){tip.style.opacity=0;setTimeout(function(){t=(t+1)%TIPS.length;tip.textContent=TIPS[t];tip.style.opacity=.85},400)},2800);var timer=setInterval(function(){var s=d.getElementById('status'),p=d.getElementById('status-progress');if(!s||!s.isConnected){if(!done){done=1;shown=100;setTimeout(function(){m.className='habis';setTimeout(function(){clearInterval(timer);m.remove()},800)},600)}draw();return}var v=0;if(p&&p.max>0&&p.value>0){v=Math.min(100,p.value/p.max*100)}else{fake=Math.min(95,fake+(95-fake)*0.02);v=fake}var n=d.getElementById('status-notice');if(n&&n.style.display!=='none'&&n.textContent){m.style.opacity=.25}shown=Math.max(shown,v);draw()},50);function draw(){cur+=(shown-cur)*0.12;if(shown-cur<0.2)cur=shown;var w=cur.toFixed(1)+'%';isi.style.width=w;alif.style.left=w;pau.style.left=w;per.textContent=Math.round(shown)+'%'}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()})();</script><!--/muat-->"
